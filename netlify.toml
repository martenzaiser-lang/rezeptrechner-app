[build]
  base = "."
  command = "npm ci --include=dev && npm run build"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "24"

# VITE_API_URL wird pro Site im Netlify-Dashboard bzw. per CLI gesetzt
# (Test-Site und später teigmaster zeigen auf rezeptrechner-api.onrender.com).

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

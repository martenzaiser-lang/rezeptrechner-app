<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mockup: Admin-Freischaltung pro Mitarbeiter</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black/30 min-h-screen flex items-center justify-center p-4" style="font-family: Inter, system-ui, sans-serif">

<!-- Mitarbeiter-Bearbeiten-Modal wie im Personalplaner, mit neuem Berechtigungs-Block -->
<div class="bg-white rounded-xl shadow-2xl border border-amber-200 p-6 max-w-lg w-full">
  <h2 class="text-lg font-bold text-amber-900 mb-4">Mitarbeiterin bearbeiten</h2>

  <div class="grid grid-cols-2 gap-3 mb-4">
    <div>
      <label class="text-xs font-medium text-amber-700">Vorname</label>
      <input class="w-full border border-amber-300 rounded-lg px-3 py-2 mt-1" value="Beispiel">
    </div>
    <div>
      <label class="text-xs font-medium text-amber-700">Nachname</label>
      <input class="w-full border border-amber-300 rounded-lg px-3 py-2 mt-1" value="Verkäuferin">
    </div>
    <div>
      <label class="text-xs font-medium text-amber-700">Beschäftigung</label>
      <select class="w-full border border-amber-300 rounded-lg px-3 py-2 mt-1 bg-white"><option>Teilzeit</option></select>
    </div>
    <div>
      <label class="text-xs font-medium text-amber-700">PIN</label>
      <input class="w-full border border-amber-300 rounded-lg px-3 py-2 mt-1" value="••••">
    </div>
  </div>

  <!-- NEU: Berechtigungen -->
  <div class="border-t border-amber-200 pt-4 mt-2 space-y-3">
    <h4 class="font-semibold text-amber-900 text-sm">Berechtigungen</h4>

    <label class="flex items-center gap-3">
      <input type="checkbox" checked class="w-5 h-5 rounded border-amber-300 accent-amber-700">
      <div>
        <span class="text-sm text-amber-900 font-medium">Nimmt an Samstags-Umfragen teil</span>
        <p class="text-xs text-amber-600">bestehende Einstellung</p>
      </div>
    </label>

    <label class="flex items-center gap-3 bg-amber-50 border border-amber-300 rounded-lg p-3">
      <input type="checkbox" checked class="w-5 h-5 rounded border-amber-300 accent-amber-700">
      <div>
        <span class="text-sm text-amber-900 font-medium">🥨 Produkt-Auskunft (Verkaufs-Ansicht)</span>
        <p class="text-xs text-amber-600">Sieht Allergene, Zutaten & Nährwerte aller Produkte im Portal — keine Rezepte/Mengen</p>
      </div>
    </label>
  </div>

  <div class="flex justify-end gap-2 mt-6">
    <button class="px-4 py-2.5 text-amber-700 rounded-lg hover:bg-amber-50 font-medium">Abbrechen</button>
    <button class="px-4 py-2.5 bg-amber-700 text-white rounded-lg hover:bg-amber-800 font-medium">Speichern</button>
  </div>
</div>

</body>
</html>
